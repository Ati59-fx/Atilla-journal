<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atilla Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #222222;
    --border2: #2e2e2e;
    --text: #f0f0f0;
    --muted: #666;
    --muted2: #444;
    --green: #00ff88;
    --green-dim: #00ff8822;
    --red: #ff4455;
    --red-dim: #ff445522;
    --neutral: #888;
    --neutral-dim: #88888822;
    --paper: #ffffff;
    --paper-dim: #ffffff22;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; background: var(--bg); z-index: 100; }
  .logo { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
  .logo-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; }
  .tabs { display: flex; }
  .tab { padding: 0 18px; height: 56px; display: flex; align-items: center; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; border-top: none; border-left: none; border-right: none; background: none; font-family: 'Syne', sans-serif; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--green); }
  
  main { max-width: 920px; margin: 0 auto; padding: 2rem; }
  .section { display: none; }
  .section.active { display: block; }

  .form-title { font-size: 22px; font-weight: 800; margin-bottom: 1.5rem; letter-spacing: -0.5px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  input, textarea, select { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: 14px; font-family: 'Syne', sans-serif; padding: 10px 12px; outline: none; transition: border-color 0.15s; width: 100%; }
  input:focus, textarea:focus, select:focus { border-color: var(--green); }
  
  .mode-row, .result-row { display: flex; gap: 8px; }
  .mode-btn, .result-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: 'Syne', sans-serif; }
  
  .mode-btn.live.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .mode-btn.paper.active { background: var(--paper-dim); border-color: var(--paper); color: var(--paper); }
  
  .result-btn.win.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .result-btn.lose.active { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .result-btn.be.active { background: var(--neutral-dim); border-color: var(--neutral); color: var(--neutral); }

  .setup-grid { display: flex; flex-wrap: wrap; gap: 6px; background: var(--surface); padding: 12px; border-radius: 8px; border: 1px solid var(--border2); }
  .setup-tag { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; border: 1px solid var(--border2); color: var(--muted); cursor: pointer; transition: all 0.15s; font-family: 'JetBrains Mono', monospace; }
  .setup-tag.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

  .submit-btn { width: 100%; margin-top: 16px; padding: 12px; background: var(--green); color: #000; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: 'Syne', sans-serif; transition: opacity 0.15s; }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .pin-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; }
  .reset-btn { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; display: none; }
  .admin-unlocked .reset-btn { display: block; }

  .trade-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.15s; }
  .trade-card.win { border-left: 3px solid var(--green); }
  .trade-card.lose { border-left: 3px solid var(--red); }
  .trade-card.be { border-left: 3px solid var(--neutral); }
  .trade-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  
  .badge { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; }
  .badge.win { background: var(--green-dim); color: var(--green); }
  .badge.lose { background: var(--red-dim); color: var(--red); }
  .badge.be { background: var(--neutral-dim); color: var(--neutral); }
  .badge.paper-tag { background: var(--paper-dim); color: var(--paper); border: 1px solid var(--paper-dim); }

  .trade-notes { padding: 0 16px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; font-size: 14px; color: var(--muted); border-top: 0 solid var(--border); }
  .trade-notes.open { max-height: 600px; padding: 12px 16px 14px; border-top-width: 1px; }

  .gauge-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 2rem; }
  .gauge-bar-outer { height: 12px; background: var(--surface2); border-radius: 6px; position: relative; overflow: hidden; border: 1px solid var(--border); }
  .gauge-bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, var(--red) 0%, var(--green) 100%); transition: width 0.5s ease; }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>ATILLA JOURNAL</div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('log')">İşlem Ekle</button>
    <button class="tab" onclick="showTab('list')">İşlemler</button>
    <button class="tab" onclick="showTab('stats')">İstatistik</button>
  </div>
</header>

<main>
  <div id="tab-log" class="section active">
    <div class="pin-bar">
      <input type="password" id="admin-pin" placeholder="PIN" maxlength="8" oninput="checkPin()" style="max-width:80px; background:var(--bg); border:1px solid var(--border2); color:white; padding:5px; border-radius:4px" />
      <span id="pin-status" style="font-size:12px; color:var(--muted); flex:1; margin-left:10px">kilitli</span>
      <button class="reset-btn" onclick="resetAccount()">HESABI RESETLE</button>
    </div>

    <div class="form-grid">
      <div class="field form-full">
        <label>İşlem Tipi</label>
        <div class="mode-row">
          <button class="mode-btn live" id="mode-live" onclick="selectMode('live')">LIVE ACCOUNT</button>
          <button class="mode-btn paper" id="mode-paper" onclick="selectMode('paper')">PAPER TRADE</button>
        </div>
      </div>
      
      <div class="field">
        <label>Tarih</label>
        <input type="date" id="f-date" />
      </div>
      
      <div class="field">
        <label>Sonuç</label>
        <div class="result-row">
          <button class="result-btn win" id="btn-win" onclick="selectResult('win')">WIN</button>
          <button class="result-btn lose" id="btn-lose" onclick="selectResult('lose')">LOSE</button>
          <button class="result-btn be" id="btn-be" onclick="selectResult('be')">B.E</button>
        </div>
      </div>

      <div class="field"><label>Sembol</label><select id="f-symbol"><option>MNQ1!</option><option>MES1!</option><option>MYM1!</option></select></div>
      <div class="field"><label>RR Oranı</label><input type="number" id="f-rr" placeholder="2.5" step="0.1" /></div>

      <div class="field form-full">
        <label>Setup / Konfirmeler</label>
        <div class="setup-grid" id="setup-selector"></div>
      </div>

      <div class="field form-full">
        <label>PNL ($)</label>
        <input type="number" id="f-pnl" placeholder="Örn: 150" />
      </div>

      <div class="field form-full"><label>Chart Linki</label><input type="url" id="f-link" /></div>
      <div class="field form-full"><label>Notlar</label><textarea id="f-notes"></textarea></div>
    </div>
    <button class="submit-btn" id="submit-btn" onclick="addTrade()" disabled>İŞLEMİ KAYDET</button>
  </div>

  <div id="tab-list" class="section">
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter(this,'all')">Tümü</button>
      <button class="filter-btn" onclick="setFilter(this,'live')">Live</button>
      <button class="filter-btn" onclick="setFilter(this,'paper')">Paper</button>
    </div>
    <div id="trade-list"></div>
  </div>

  <div id="tab-stats" class="section">
    <div id="gauge-container" class="gauge-wrap"></div>
    <div class="stats-grid" id="stats-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:2rem"></div>
    <div class="chart-wrap" style="background:var(--surface); padding:20px; border-radius:10px; border:1px solid var(--border)">
        <canvas id="equity-chart" height="200"></canvas>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://ssopmrubowgvdjhitfba.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pn_1Ve9kiTi9IkzEssOchg_Qd6VA3pu';
const ADMIN_PIN = '5959';
const INITIAL_BALANCE = 25000;
const SETUPS = ["WC","DC","90MC","MICRO CYCLE","5M SD","15M SD","30M SD","1H SD","4H SD","MMxM","4h po3","30m po3","1h po3","PSP","PRC","15s cisd","1m cisd"];
const H = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

let trades = [];
let selectedMode = 'live';
let selectedResult = null;
let selectedSetups = new Set();
let adminUnlocked = false;
let equityChart = null;
let activeFilter = 'all';

// Setup Selector
const setupSelector = document.getElementById('setup-selector');
SETUPS.forEach(s => {
    const tag = document.createElement('div');
    tag.className = 'setup-tag';
    tag.textContent = s;
    tag.onclick = () => { tag.classList.toggle('active'); tag.classList.contains('active') ? selectedSetups.add(s) : selectedSetups.delete(s); };
    setupSelector.appendChild(tag);
});

function checkPin() {
    adminUnlocked = document.getElementById('admin-pin').value === ADMIN_PIN;
    document.getElementById('pin-status').textContent = adminUnlocked ? '✓ açık' : 'kilitli';
    document.getElementById('submit-btn').disabled = !adminUnlocked;
    document.body.classList.toggle('admin-unlocked', adminUnlocked);
}

function selectMode(m) {
    selectedMode = m;
    document.getElementById('mode-live').classList.toggle('active', m === 'live');
    document.getElementById('mode-paper').classList.toggle('active', m === 'paper');
}

function selectResult(v) {
    selectedResult = v;
    document.querySelectorAll('.result-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + v).classList.add('active');
}

async function loadTrades() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/trades?select=*&order=date.asc', { headers: H });
    trades = await res.json();
    render();
}

async function addTrade() {
    const pnlInput = parseFloat(document.getElementById('f-pnl').value) || 0;
    const pnl = selectedResult === 'win' ? Math.abs(pnlInput) : (selectedResult === 'lose' ? -Math.abs(pnlInput) : 0);
    
    // Veritabanında Paper/Live ayrımı için 'result' sütununu kullanıyorduk. 
    // Karışıklık olmaması için result: 'win', 'lose', 'be' ve setup kısmına m:paper ekliyoruz.
    // Veya result kısmını 'paper-win' gibi kaydedebiliriz. En temizi setup stringine gizlemek veya ek sütun.
    // Burada 'notes' kısmının başına [PAPER] ekleyerek veya result'ı modifiye ederek gidelim:
    const finalResult = selectedMode === 'paper' ? 'paper-' + selectedResult : selectedResult;

    await fetch(SUPABASE_URL + '/rest/v1/trades', {
        method: 'POST',
        headers: { ...H, 'Prefer': 'return=representation' },
        body: JSON.stringify({
            date: document.getElementById('f-date').value,
            result: finalResult,
            rr: parseFloat(document.getElementById('f-rr').value),
            pnl: pnl,
            symbol: document.getElementById('f-symbol').value,
            setup: Array.from(selectedSetups).join(', '),
            notes: document.getElementById('f-notes').value,
            link: document.getElementById('f-link').value
        })
    });
    location.reload();
}

function render() {
    const liveTrades = trades.filter(t => !t.result.startsWith('paper-'));
    const totalPnl = liveTrades.reduce((s, t) => s + Number(t.pnl), 0);
    const equity = INITIAL_BALANCE + totalPnl;

    // Gauge
    const target = INITIAL_BALANCE + 1250;
    const dd = INITIAL_BALANCE - 1000;
    const pct = Math.max(0, Math.min(100, ((equity - dd) / (target - dd)) * 100));
    document.getElementById('gauge-container').innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:10px">
            <span style="font-size:11px; color:var(--muted)">HESAP DURUMU</span>
            <span style="font-family:JetBrains Mono; font-weight:800">$${equity.toFixed(0)}</span>
        </div>
        <div class="gauge-bar-outer"><div class="gauge-bar-inner" style="width:${pct}%"></div></div>
    `;

    // Stats
    const wins = liveTrades.filter(t => t.result === 'win').length;
    const loses = liveTrades.filter(t => t.result === 'lose').length;
    const wr = (wins+loses) > 0 ? ((wins/(wins+loses))*100).toFixed(1) : 0;
    document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card" style="background:var(--surface); padding:15px; border-radius:10px; border:1px solid var(--border)">
            <div style="font-size:10px; color:var(--muted)">TOTAL PNL</div>
            <div style="font-size:20px; font-weight:800; color:${totalPnl>=0?'var(--green)':'var(--red)'}">${totalPnl>=0?'+':''}$${totalPnl.toFixed(0)}</div>
        </div>
        <div class="stat-card" style="background:var(--surface); padding:15px; border-radius:10px; border:1px solid var(--border)">
            <div style="font-size:10px; color:var(--muted)">WIN RATE</div>
            <div style="font-size:20px; font-weight:800">${wr}%</div>
        </div>
    `;

    // List
    const list = [...trades].reverse().filter(t => {
        if(activeFilter === 'live') return !t.result.startsWith('paper-');
        if(activeFilter === 'paper') return t.result.startsWith('paper-');
        return true;
    });
    document.getElementById('trade-list').innerHTML = list.map(t => {
        const isPaper = t.result.startsWith('paper-');
        const res = isPaper ? t.result.replace('paper-', '') : t.result;
        return `
            <div class="trade-card ${res}">
                <div class="trade-top" onclick="this.nextElementSibling.classList.toggle('open')">
                    <span class="badge ${res}">${res.toUpperCase()}</span>
                    ${isPaper ? '<span class="badge paper-tag">PAPER</span>' : ''}
                    <span style="flex:1; font-family:JetBrains Mono; font-size:13px">${t.date}</span>
                    <span style="font-family:JetBrains Mono; font-weight:700">${isPaper ? '$0' : (t.pnl>=0?'+':'')+t.pnl}</span>
                </div>
                <div class="trade-notes">
                    <div style="padding:10px 0; font-size:11px; color:var(--muted)">SETUPS: ${t.setup}</div>
                    <div style="padding-bottom:10px">${t.notes}</div>
                    ${t.link ? `<a href="${t.link}" target="_blank" style="color:var(--green); font-size:12px">View Chart ↗</a>` : ''}
                </div>
            </div>
        `;
    }).join('');

    // Chart
    const ctx = document.getElementById('equity-chart').getContext('2d');
    let cum = INITIAL_BALANCE;
    const chartData = liveTrades.map(t => { cum += Number(t.pnl); return cum; });
    if(equityChart) equityChart.destroy();
    equityChart = new Chart(ctx, {
        type: 'line',
        data: { labels: liveTrades.map(t => t.date), datasets: [{ data: chartData, borderColor: '#00ff88', tension: 0.3, pointRadius: 0 }] },
        options: { plugins: { legend: { display: false } }, scales: { x: { display: false } } }
    });
}

function showTab(t) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + t).classList.add('active');
    event.currentTarget.classList.add('active');
}

function setFilter(btn, f) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

async function resetAccount() {
    if(!confirm("Tüm veriler silinecek!")) return;
    await fetch(SUPABASE_URL + '/rest/v1/trades?id=gt.0', { method: 'DELETE', headers: H });
    location.reload();
}

loadTrades();
</script>
</body>
</html>
