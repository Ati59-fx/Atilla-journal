<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atilla Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #222222;
    --border2: #2e2e2e;
    --text: #f0f0f0;
    --muted: #666;
    --muted2: #444;
    --green: #00ff88;
    --green-dim: #00ff8822;
    --red: #ff4455;
    --red-dim: #ff445522;
    --accent: #00ff88;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .logo {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; }
  .tabs { display: flex; gap: 0; }
  .tab {
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    letter-spacing: 0.3px;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'Syne', sans-serif;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--green); }
  .status { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* MAIN */
  main { max-width: 900px; margin: 0 auto; padding: 2rem; }
  .section { display: none; }
  .section.active { display: block; }

  /* FORM */
  .form-title { font-size: 22px; font-weight: 800; margin-bottom: 1.5rem; letter-spacing: -0.5px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  input, textarea, select {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Syne', sans-serif;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, textarea:focus { border-color: var(--green); }
  textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }

  .result-row { display: flex; gap: 8px; }
  .result-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Syne', sans-serif;
    letter-spacing: 0.5px;
  }
  .result-btn:hover { border-color: var(--border2); color: var(--text); }
  .result-btn.win.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .result-btn.lose.active { background: var(--red-dim); border-color: var(--red); color: var(--red); }

  .submit-btn {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    background: var(--green);
    color: #000;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    letter-spacing: 0.5px;
    transition: opacity 0.15s;
  }
  .submit-btn:hover { opacity: 0.85; }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .msg { text-align: center; font-size: 13px; margin-top: 10px; height: 20px; }
  .msg.ok { color: var(--green); }
  .msg.err { color: var(--red); }

  /* ADMIN PIN */
  .pin-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1.5rem;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
  }
  .pin-bar label { margin: 0; white-space: nowrap; }
  .pin-bar input { max-width: 140px; margin: 0; }
  .pin-status { font-size: 12px; font-family: 'JetBrains Mono', monospace; }
  .pin-status.ok { color: var(--green); }
  .pin-status.no { color: var(--muted); }

  /* TRADE LIST */
  .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .list-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .trade-count { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  .trade-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .trade-card:hover { border-color: var(--border2); }
  .trade-card.win { border-left: 3px solid var(--green); }
  .trade-card.lose { border-left: 3px solid var(--red); }

  .trade-top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
  }
  .badge {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  .badge.win { background: var(--green-dim); color: var(--green); }
  .badge.lose { background: var(--red-dim); color: var(--red); }

  .trade-meta { display: flex; gap: 20px; flex: 1; }
  .meta-item { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 1px; }
  .meta-val { font-size: 14px; font-weight: 600; color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .meta-val.pos { color: var(--green); }
  .meta-val.neg { color: var(--red); }

  .trade-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .chart-link {
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    padding: 4px 8px;
    border: 1px solid var(--border2);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.15s;
  }
  .chart-link:hover { color: var(--text); border-color: var(--muted); }
  .expand-icon { font-size: 10px; color: var(--muted); transition: transform 0.2s; }
  .expand-icon.open { transform: rotate(180deg); }
  .del-btn {
    background: none;
    border: none;
    color: var(--muted2);
    cursor: pointer;
    font-size: 14px;
    padding: 4px 6px;
    border-radius: 4px;
    transition: all 0.15s;
    display: none;
  }
  .del-btn:hover { color: var(--red); background: var(--red-dim); }
  .admin-unlocked .del-btn { display: block; }

  .trade-notes {
    padding: 0 16px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, padding 0.3s ease;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.7;
    border-top: 0 solid var(--border);
  }
  .trade-notes.open {
    max-height: 400px;
    padding: 12px 16px 14px;
    border-top-width: 1px;
  }

  .empty { text-align: center; padding: 4rem; color: var(--muted); font-size: 14px; }

  /* STATS */
  .stats-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 1.5rem; }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 2rem; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .stat-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .stat-val { font-size: 24px; font-weight: 800; font-family: 'JetBrains Mono', monospace; letter-spacing: -1px; }
  .stat-val.pos { color: var(--green); }
  .stat-val.neg { color: var(--red); }

  /* CALENDAR */
  .cal-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .cal-month { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
  .cal-nav-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--muted);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .cal-nav-btn:hover { color: var(--text); border-color: var(--muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-dow {
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--muted2);
    letter-spacing: 1px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
  }
  .cal-day {
    min-height: 72px;
    padding: 8px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }
  .cal-day:nth-child(7n) { border-right: none; }
  .cal-day.empty { background: #0d0d0d; }
  .cal-day.profit { background: #001a0d; }
  .cal-day.loss { background: #1a0005; }
  .cal-day.today { background: #0a1a0a; outline: 1px solid var(--green); outline-offset: -1px; }
  .day-num { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .day-pnl { font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .day-pnl.pos { color: var(--green); }
  .day-pnl.neg { color: var(--red); }
  .day-count { font-size: 10px; color: var(--muted2); }

  /* LOADING */
  .loading { text-align: center; padding: 3rem; color: var(--muted); font-size: 13px; font-family: 'JetBrains Mono', monospace; }

  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    main { padding: 1rem; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .form-full { grid-column: 1; }
    .trade-meta { gap: 10px; flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    ATILLA JOURNAL
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('log')">İşlem Ekle</button>
    <button class="tab" onclick="showTab('list')">İşlemler</button>
    <button class="tab" onclick="showTab('stats')">İstatistik</button>
  </div>
  <div class="status">
    <div class="status-dot"></div>
    <span id="conn-status">bağlanıyor...</span>
  </div>
</header>

<main>

  <!-- LOG TAB -->
  <div id="tab-log" class="section active">
    <div class="pin-bar">
      <label>ADMİN PİN</label>
      <input type="password" id="admin-pin" placeholder="••••" maxlength="8" oninput="checkPin()" style="max-width:120px" />
      <span class="pin-status no" id="pin-status">kilitli — sadece görüntüleme</span>
    </div>

    <p class="form-title">Yeni İşlem</p>
    <div class="form-grid">
      <div class="field">
        <label>Tarih</label>
        <input type="date" id="f-date" />
      </div>
      <div class="field">
        <label>Sonuç</label>
        <div class="result-row">
          <button class="result-btn win" id="btn-win" onclick="selectResult('win')">WIN</button>
          <button class="result-btn lose" id="btn-lose" onclick="selectResult('lose')">LOSE</button>
        </div>
      </div>
      <div class="field">
        <label>RR Oranı</label>
        <input type="number" id="f-rr" placeholder="2.5" step="0.1" min="0" />
      </div>
      <div class="field">
        <label>PnL ($)</label>
        <input type="number" id="f-pnl" placeholder="150 veya -75" />
      </div>
      <div class="field form-full">
        <label>TradingView Chart Linki</label>
        <input type="url" id="f-link" placeholder="https://www.tradingview.com/chart/..." />
      </div>
      <div class="field form-full">
        <label>İşlem Notu</label>
        <textarea id="f-notes" placeholder="Neden aldın, psikolojin nasıldı, kurguyu nasıl yaptın..."></textarea>
      </div>
    </div>
    <button class="submit-btn" id="submit-btn" onclick="addTrade()">İŞLEMİ KAYDET</button>
    <div class="msg" id="form-msg"></div>
  </div>

  <!-- LIST TAB -->
  <div id="tab-list" class="section">
    <div class="list-header">
      <div class="list-title">İşlemler</div>
      <div class="trade-count" id="trade-count"></div>
    </div>
    <div id="trade-list"><div class="loading">yükleniyor...</div></div>
  </div>

  <!-- STATS TAB -->
  <div id="tab-stats" class="section">
    <div class="stats-title">İstatistik & Takvim</div>
    <div class="stats-grid" id="stats-grid"></div>
    <div class="cal-wrap">
      <div class="cal-header">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
        <div class="cal-month" id="cal-title"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>

</main>

<script>
const SUPABASE_URL = 'https://ssopmrubowgvdjhitfba.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pn_1Ve9kiTi9IkzEssOchg_Qd6VA3pu';
const ADMIN_PIN = '1234'; // Bunu değiştir!
const headers = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

let trades = [];
let selectedResult = null;
let adminUnlocked = false;
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

document.getElementById('f-date').value = new Date().toISOString().split('T')[0];

function checkPin() {
  const pin = document.getElementById('admin-pin').value;
  adminUnlocked = pin === ADMIN_PIN;
  const st = document.getElementById('pin-status');
  if (adminUnlocked) {
    st.textContent = '✓ admin modu açık';
    st.className = 'pin-status ok';
    document.body.classList.add('admin-unlocked');
    document.getElementById('submit-btn').disabled = false;
  } else {
    st.textContent = 'kilitli — sadece görüntüleme';
    st.className = 'pin-status no';
    document.body.classList.remove('admin-unlocked');
    document.getElementById('submit-btn').disabled = true;
  }
}

function selectResult(v) {
  selectedResult = v;
  document.getElementById('btn-win').className = 'result-btn win' + (v==='win'?' active':'');
  document.getElementById('btn-lose').className = 'result-btn lose' + (v==='lose'?' active':'');
}

async function loadTrades() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/trades?select=*&order=date.desc,created_at.desc`, { headers });
    if (!res.ok) throw new Error();
    trades = await res.json();
    document.getElementById('conn-status').textContent = 'canlı';
  } catch(e) {
    document.getElementById('conn-status').textContent = 'bağlantı hatası';
    trades = [];
  }
  render();
}

async function addTrade() {
  if (!adminUnlocked) return;
  const date = document.getElementById('f-date').value;
  const rr = parseFloat(document.getElementById('f-rr').value);
  const pnl = parseFloat(document.getElementById('f-pnl').value);
  const link = document.getElementById('f-link').value.trim();
  const notes = document.getElementById('f-notes').value.trim();

  if (!date || !selectedResult || isNaN(rr) || isNaN(pnl)) {
    showMsg('Tarih, sonuç, RR ve PnL zorunlu!', 'err');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'KAYDEDİLİYOR...';

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/trades`, {
      method: 'POST',
      headers: { ...headers, 'Prefer': 'return=representation' },
      body: JSON.stringify({ date, result: selectedResult, rr, pnl, link, notes })
    });
    if (!res.ok) throw new Error();
    showMsg('İşlem kaydedildi!', 'ok');
    document.getElementById('f-rr').value = '';
    document.getElementById('f-pnl').value = '';
    document.getElementById('f-link').value = '';
    document.getElementById('f-notes').value = '';
    selectedResult = null;
    document.getElementById('btn-win').className = 'result-btn win';
    document.getElementById('btn-lose').className = 'result-btn lose';
    await loadTrades();
  } catch(e) {
    showMsg('Kaydetme hatası!', 'err');
  }

  btn.disabled = false;
  btn.textContent = 'İŞLEMİ KAYDET';
}

async function deleteTrade(id) {
  if (!adminUnlocked) return;
  if (!confirm('Bu işlemi silmek istiyor musun?')) return;
  await fetch(`${SUPABASE_URL}/rest/v1/trades?id=eq.${id}`, { method: 'DELETE', headers });
  await loadTrades();
}

function toggleNotes(id) {
  const notes = document.getElementById('notes-' + id);
  const icon = document.getElementById('icon-' + id);
  if (notes) notes.classList.toggle('open');
  if (icon) icon.classList.toggle('open');
}

function showMsg(txt, type) {
  const el = document.getElementById('form-msg');
  el.textContent = txt;
  el.className = 'msg ' + type;
  setTimeout(() => { el.textContent = ''; el.className = 'msg'; }, 3000);
}

function render() {
  renderList();
  renderStats();
  renderCal();
}

function renderList() {
  const el = document.getElementById('trade-list');
  document.getElementById('trade-count').textContent = `${trades.length} işlem`;
  if (!trades.length) {
    el.innerHTML = '<div class="empty">Henüz işlem kaydedilmedi.</div>';
    return;
  }
  el.innerHTML = trades.map(t => `
    <div class="trade-card ${t.result}">
      <div class="trade-top" onclick="toggleNotes(${t.id})">
        <span class="badge ${t.result}">${t.result.toUpperCase()}</span>
        <div class="trade-meta">
          <div class="meta-item"><span style="font-size:10px">TARİH</span><span class="meta-val mono">${t.date}</span></div>
          <div class="meta-item"><span style="font-size:10px">RR</span><span class="meta-val">${t.rr}R</span></div>
          <div class="meta-item"><span style="font-size:10px">PNL</span><span class="meta-val ${t.pnl>=0?'pos':'neg'}">${t.pnl>=0?'+':''}$${t.pnl.toFixed(0)}</span></div>
        </div>
        <div class="trade-actions">
          ${t.link ? `<a class="chart-link" href="${t.link}" target="_blank" onclick="event.stopPropagation()">CHART ↗</a>` : ''}
          ${t.notes ? `<span class="expand-icon" id="icon-${t.id}">▼</span>` : ''}
          <button class="del-btn" onclick="event.stopPropagation();deleteTrade(${t.id})">✕</button>
        </div>
      </div>
      ${t.notes ? `<div class="trade-notes" id="notes-${t.id}">${t.notes}</div>` : ''}
    </div>
  `).join('');
}

function renderStats() {
  const el = document.getElementById('stats-grid');
  if (!trades.length) { el.innerHTML = ''; return; }
  const wins = trades.filter(t => t.result === 'win').length;
  const total = trades.length;
  const wr = ((wins / total) * 100).toFixed(1);
  const totalPnl = trades.reduce((s, t) => s + Number(t.pnl), 0);
  const grossWin = trades.filter(t => t.pnl > 0).reduce((s, t) => s + Number(t.pnl), 0);
  const grossLoss = Math.abs(trades.filter(t => t.pnl < 0).reduce((s, t) => s + Number(t.pnl), 0));
  const pf = grossLoss === 0 ? '∞' : (grossWin / grossLoss).toFixed(2);
  const avgRR = (trades.reduce((s, t) => s + Number(t.rr), 0) / total).toFixed(2);

  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Toplam PnL</div>
      <div class="stat-val ${totalPnl>=0?'pos':'neg'}">${totalPnl>=0?'+':''}$${totalPnl.toFixed(0)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Win Rate</div>
      <div class="stat-val">${wr}%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Profit Factor</div>
      <div class="stat-val">${pf}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ort. RR</div>
      <div class="stat-val">${avgRR}R</div>
    </div>
  `;
}

function changeMonth(d) {
  calMonth += d;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCal();
}

function renderCal() {
  const months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  document.getElementById('cal-title').textContent = `${months[calMonth]} ${calYear}`;
  const grid = document.getElementById('cal-grid');
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const firstDay = (new Date(calYear, calMonth, 1).getDay() + 6) % 7;
  const today = new Date().toISOString().split('T')[0];

  const dayData = {};
  trades.forEach(t => {
    const [y, m, d] = t.date.split('-').map(Number);
    if (y === calYear && m === calMonth + 1) {
      if (!dayData[d]) dayData[d] = { pnl: 0, count: 0 };
      dayData[d].pnl += Number(t.pnl);
      dayData[d].count++;
    }
  });

  const dows = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const data = dayData[d];
    let cls = 'cal-day';
    if (ds === today) cls += ' today';
    else if (data) cls += data.pnl >= 0 ? ' profit' : ' loss';
    html += `<div class="${cls}">
      <div class="day-num">${d}</div>
      ${data ? `<div class="day-pnl ${data.pnl>=0?'pos':'neg'}">${data.pnl>=0?'+':''}$${data.pnl.toFixed(0)}</div><div class="day-count">${data.count} işlem</div>` : ''}
    </div>`;
  }
  grid.innerHTML = html;
}

function showTab(t) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  document.querySelectorAll('.tab')[['log','list','stats'].indexOf(t)].classList.add('active');
}

// Init
document.getElementById('submit-btn').disabled = true;
loadTrades();
</script>
</body>
