<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atilla Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #222222;
    --border2: #2e2e2e;
    --text: #f0f0f0;
    --muted: #666;
    --muted2: #444;
    --green: #00ff88;
    --green-dim: #00ff8822;
    --red: #ff4455;
    --red-dim: #ff445522;
    --neutral: #888;
    --neutral-dim: #88888822;
    --paper: #ffffff;
    --paper-dim: #ffffff22;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; background: var(--bg); z-index: 100; }
  .logo { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
  .logo-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; }
  .tabs { display: flex; }
  .tab { padding: 0 18px; height: 56px; display: flex; align-items: center; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; border-top: none; border-left: none; border-right: none; background: none; font-family: 'Syne', sans-serif; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--green); }
  .status { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  main { max-width: 920px; margin: 0 auto; padding: 2rem; }
  .section { display: none; }
  .section.active { display: block; }

  .form-title { font-size: 22px; font-weight: 800; margin-bottom: 1.5rem; letter-spacing: -0.5px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  input, textarea, select { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-size: 14px; font-family: 'Syne', sans-serif; padding: 10px 12px; outline: none; transition: border-color 0.15s; width: 100%; }
  input:focus, textarea:focus, select:focus { border-color: var(--green); }
  textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }
  select option { background: #1a1a1a; }

  .mode-row, .result-row { display: flex; gap: 8px; }
  .mode-btn, .result-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: 'Syne', sans-serif; letter-spacing: 0.5px; }
  
  .mode-btn.live.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .mode-btn.paper.active { background: var(--paper-dim); border-color: var(--paper); color: var(--paper); }
  
  .result-btn.win.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .result-btn.lose.active { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .result-btn.be.active { background: var(--neutral-dim); border-color: var(--neutral); color: var(--neutral); }

  .setup-grid { display: flex; flex-wrap: wrap; gap: 6px; background: var(--surface); padding: 12px; border-radius: 8px; border: 1px solid var(--border2); }
  .setup-tag { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; border: 1px solid var(--border2); color: var(--muted); cursor: pointer; transition: all 0.15s; font-family: 'JetBrains Mono', monospace; }
  .setup-tag.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }

  .pnl-preview { font-size: 11px; font-family: 'JetBrains Mono', monospace; margin-top: 4px; height: 16px; }
  .pnl-preview.pos { color: var(--green); }
  .pnl-preview.neg { color: var(--red); }
  .pnl-preview.neu { color: var(--neutral); }
  .pnl-preview.pap { color: var(--paper); }

  .submit-btn { width: 100%; margin-top: 16px; padding: 12px; background: var(--green); color: #000; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: 'Syne', sans-serif; letter-spacing: 0.5px; transition: opacity 0.15s; }
  .submit-btn:hover { opacity: 0.85; }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .msg { text-align: center; font-size: 13px; margin-top: 10px; height: 20px; }
  .msg.ok { color: var(--green); }
  .msg.err { color: var(--red); }

  .pin-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; }
  .pin-bar label { margin: 0; white-space: nowrap; }
  .pin-status { font-size: 12px; font-family: 'JetBrains Mono', monospace; flex: 1; }
  .pin-status.ok { color: var(--green); }
  .pin-status.no { color: var(--muted); }
  .reset-btn { background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; display: none; transition: 0.15s; }
  .admin-unlocked .reset-btn { display: block; }
  .reset-btn:hover { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  #clear-reset-btn { display: none; font-size: 10px; color: var(--muted); cursor: pointer; text-decoration: underline; }
  #clear-reset-btn:hover { color: var(--text); }

  .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px; }
  .list-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .trade-count { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .filter-btn { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border2); background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Syne', sans-serif; transition: all 0.15s; }
  .filter-btn.active { border-color: var(--green); color: var(--green); background: var(--green-dim); }

  .trade-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.15s; }
  .trade-card:hover { border-color: var(--border2); }
  .trade-card.win { border-left: 3px solid var(--green); }
  .trade-card.lose { border-left: 3px solid var(--red); }
  .trade-card.be { border-left: 3px solid var(--neutral); }
  .trade-card.paper { border-left: 3px solid var(--paper); }

  .trade-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .badge { font-size: 10px; font-weight: 800; letter-spacing: 1px; padding: 3px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; }
  .badge.win { background: var(--green-dim); color: var(--green); }
  .badge.lose { background: var(--red-dim); color: var(--red); }
  .badge.be { background: var(--neutral-dim); color: var(--neutral); }
  .badge.paper-tag { background: var(--paper-dim); color: var(--paper); border: 1px solid var(--paper-dim); }
  .sym-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: #1a1a1a; color: var(--muted); font-family: 'JetBrains Mono', monospace; border: 1px solid var(--border2); }

  .trade-meta { display: flex; gap: 16px; flex: 1; flex-wrap: wrap; justify-content: flex-end; padding-right: 10px; }
  .meta-item { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 1px; text-align: right; }
  .meta-val { font-size: 14px; font-weight: 600; color: var(--text); font-family: 'JetBrains Mono', monospace; }
  
  /* GLOW EFEKTLERİ */
  .meta-val.pos { color: var(--green); text-shadow: 0 0 10px rgba(0,255,136,0.4); }
  .meta-val.neg { color: var(--red); text-shadow: 0 0 10px rgba(255,68,85,0.4); }
  .meta-val.neu { color: var(--neutral); }
  .meta-val.pap { color: var(--paper); text-shadow: 0 0 10px rgba(255,255,255,0.3); }

  .trade-actions { display: flex; gap: 8px; align-items: center; }
  .chart-link { font-size: 11px; color: var(--muted); text-decoration: none; padding: 4px 8px; border: 1px solid var(--border2); border-radius: 4px; font-family: 'JetBrains Mono', monospace; transition: all 0.15s; }
  .chart-link:hover { color: var(--text); border-color: var(--muted); }
  .expand-icon { font-size: 10px; color: var(--muted); transition: transform 0.2s; }
  .expand-icon.open { transform: rotate(180deg); }
  .del-btn { background: none; border: none; color: var(--muted2); cursor: pointer; font-size: 14px; padding: 4px 6px; border-radius: 4px; transition: all 0.15s; display: none; }
  .del-btn:hover { color: var(--red); background: var(--red-dim); }
  .admin-unlocked .del-btn { display: block; }

  .trade-notes { padding: 0 16px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; font-size: 14px; color: var(--muted); line-height: 1.7; border-top: 0 solid var(--border); }
  .trade-notes.open { max-height: 600px; padding: 12px 16px 14px; border-top-width: 1px; }
  .setup-display { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
  .setup-mini-badge { background: var(--surface2); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border2); font-family: 'JetBrains Mono', monospace; font-weight: 600; }

  /* İSTATİSTİKLER & GAUGE */
  .stats-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 1.5rem; display:flex; align-items:center; gap:10px; }
  .reset-badge { font-size: 10px; background: var(--surface2); border:1px solid var(--border2); padding: 4px 8px; border-radius: 4px; color: var(--muted); font-weight: 600; font-family: 'JetBrains Mono', monospace; display: none; }
  
  .gauge-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 2rem; }
  .gauge-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
  .gauge-title { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .gauge-equity { font-size: 20px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
  .gauge-bar-outer { height: 12px; background: var(--surface2); border-radius: 6px; position: relative; overflow: hidden; border: 1px solid var(--border); }
  .gauge-bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, var(--red) 0%, var(--green) 100%); transition: width 0.5s ease; }
  .gauge-marker { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; z-index: 2; }
  .gauge-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--muted); }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 2rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat-label { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .stat-val { font-size: 24px; font-weight: 800; font-family: 'JetBrains Mono', monospace; letter-spacing: -1px; }
  .stat-val.pos { color: var(--green); text-shadow: 0 0 15px rgba(0,255,136,0.3); }
  .stat-val.neg { color: var(--red); text-shadow: 0 0 15px rgba(255,68,85,0.3); }
  .stat-detail { font-size: 11px; color: var(--muted); margin-top: 6px; font-family: 'JetBrains Mono', monospace; line-height: 1.4; }

  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 2rem; }
  .chart-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
  .chart-canvas { height: 200px; position: relative; }

  /* SYMBOL GRID */
  .symbol-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 2rem; }
  .symbol-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .symbol-name { font-size: 13px; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--text); margin-bottom: 10px; }
  .symbol-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .symbol-row span:last-child { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text); }
  .symbol-row .pos { color: var(--green); text-shadow: 0 0 8px rgba(0,255,136,0.3); }
  .symbol-row .neg { color: var(--red); text-shadow: 0 0 8px rgba(255,68,85,0.3); }

  /* CALENDAR */
  .cal-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 2rem; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .cal-month { font-size: 16px; font-weight: 700; }
  .cal-nav-btn { background: none; border: 1px solid var(--border2); color: var(--muted); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .cal-nav-btn:hover { color: var(--text); border-color: var(--muted); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-dow { text-align: center; font-size: 10px; font-weight: 700; color: var(--muted2); letter-spacing: 1px; padding: 10px 0; border-bottom: 1px solid var(--border); text-transform: uppercase; }
  .cal-day { min-height: 72px; padding: 8px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .cal-day:nth-child(7n) { border-right: none; }
  .cal-day.empty { background: #0d0d0d; }
  .cal-day.profit { background: #001a0d; }
  .cal-day.loss { background: #1a0005; }
  .cal-day.today { background: #0a1a0a; outline: 1px solid var(--green); outline-offset: -1px; }
  .day-num { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .day-pnl { font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .day-pnl.pos { color: var(--green); text-shadow: 0 0 5px rgba(0,255,136,0.5); }
  .day-pnl.neg { color: var(--red); text-shadow: 0 0 5px rgba(255,68,85,0.5); }
  .day-count { font-size: 10px; color: var(--muted2); }

  .section-sep { margin: 2rem 0; border: none; border-top: 1px solid var(--border); }

  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    .tab { padding: 0 12px; font-size: 12px; }
    main { padding: 1rem; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .symbol-grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .trade-meta { display: none; } 
  }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>ATILLA JOURNAL</div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('log')">İşlem Ekle</button>
    <button class="tab" onclick="showTab('list')">İşlemler</button>
    <button class="tab" onclick="showTab('stats')">İstatistik</button>
  </div>
  <div class="status">
    <div class="status-dot"></div>
    <span id="conn-status">bağlanıyor...</span>
  </div>
</header>

<main>
  <div id="tab-log" class="section active">
    <div class="pin-bar">
      <label>ADMİN PİN</label>
      <input type="password" id="admin-pin" placeholder="••••" maxlength="8" oninput="checkPin()" style="max-width:80px" />
      <span class="pin-status no" id="pin-status">kilitli</span>
      <button class="reset-btn" onclick="setResetPoint()">HESABI RESETLE</button>
      <span id="clear-reset-btn" onclick="clearResetPoint()">(Sıfırlamayı İptal Et)</span>
    </div>
    
    <p class="form-title">Yeni İşlem</p>
    <div class="form-grid">
      
      <div class="field form-full">
        <label>Hesap Modu</label>
        <div class="mode-row">
          <button class="mode-btn live active" id="mode-live" onclick="selectMode('live')">LIVE ACCOUNT</button>
          <button class="mode-btn paper" id="mode-paper" onclick="selectMode('paper')">PAPER TRADE</button>
        </div>
      </div>

      <div class="field">
        <label>Tarih</label>
        <input type="date" id="f-date" />
      </div>
      <div class="field">
        <label>Sonuç</label>
        <div class="result-row">
          <button class="result-btn win" id="btn-win" onclick="selectResult('win')">WIN</button>
          <button class="result-btn be" id="btn-be" onclick="selectResult('be')">B.E</button>
          <button class="result-btn lose" id="btn-lose" onclick="selectResult('lose')">LOSE</button>
        </div>
      </div>
      
      <div class="field">
        <label>Sembol</label>
        <select id="f-symbol">
          <option value="MNQ1!">MNQ1!</option>
          <option value="MES1!">MES1!</option>
          <option value="MYM1!">MYM1!</option>
        </select>
      </div>
      <div class="field">
        <label>RR Oranı</label>
        <input type="number" id="f-rr" placeholder="2.5" step="0.1" min="0" />
      </div>

      <div class="field form-full">
        <label>Setup / Konfirmeler</label>
        <div class="setup-grid" id="setup-selector">
          </div>
      </div>

      <div class="field form-full">
        <label>PNL ($)</label>
        <input type="number" id="f-pnl" placeholder="Örn: 150" min="0" oninput="updatePnlPreview()" />
        <div class="pnl-preview" id="pnl-preview"></div>
      </div>
      <div class="field form-full">
        <label>TradingView Chart Linki</label>
        <input type="url" id="f-link" placeholder="https://www.tradingview.com/chart/..." />
      </div>
      <div class="field form-full">
        <label>İşlem Notu</label>
        <textarea id="f-notes" placeholder="Neden aldın, psikolojin nasıldı, kurguyu nasıl yaptın..."></textarea>
      </div>
    </div>
    <button class="submit-btn" id="submit-btn" onclick="addTrade()" disabled>İŞLEMİ KAYDET</button>
    <div class="msg" id="form-msg"></div>
  </div>

  <div id="tab-list" class="section">
    <div class="list-header">
      <div class="list-title">İşlemler</div>
      <div class="trade-count" id="trade-count"></div>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter(this,'all')">Tümü</button>
      <button class="filter-btn" onclick="setFilter(this,'live')">Live</button>
      <button class="filter-btn" onclick="setFilter(this,'paper')">Paper</button>
      <button class="filter-btn" onclick="setFilter(this,'MNQ1!')">MNQ1!</button>
      <button class="filter-btn" onclick="setFilter(this,'MES1!')">MES1!</button>
      <button class="filter-btn" onclick="setFilter(this,'MYM1!')">MYM1!</button>
    </div>
    <div id="trade-list"></div>
  </div>

  <div id="tab-stats" class="section">
    <div class="stats-title">
        İstatistik (Sadece Live)
        <span class="reset-badge" id="reset-badge">SIFIRLANMIŞ VERİ</span>
    </div>
    
    <div class="gauge-wrap" id="gauge-container"></div>

    <div class="stats-grid" id="stats-grid"></div>

    <div class="chart-wrap">
      <div class="chart-label">Equity Curve (25k Başlangıç)</div>
      <div class="chart-canvas"><canvas id="equity-chart"></canvas></div>
    </div>

    <div class="chart-label">Sembol Bazında (Pair Win Rates)</div>
    <div class="symbol-grid" id="symbol-grid"></div>

    <hr class="section-sep">

    <div class="chart-label">Günlük PnL Takvimi</div>
    <div class="cal-wrap">
      <div class="cal-header">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
        <div class="cal-month" id="cal-title"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://ssopmrubowgvdjhitfba.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pn_1Ve9kiTi9IkzEssOchg_Qd6VA3pu';
const ADMIN_PIN = '5959';
const INITIAL_BALANCE = 25000;
const PROFIT_TARGET = 1250; 
const DRAWDOWN_LIMIT = 1000; 

const SETUPS = [
    "WC", "DC", "90MC", "MICRO CYCLE", "5M SD", "15M SD", "30M SD", 
    "1H SD", "4H SD", "MMxM", "4h po3", "30m po3", "1h po3", 
    "PSP", "PRC", "15s cisd", "1m cisd"
];

const H = { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

let trades = [];
let selectedMode = 'live';
let selectedResult = null;
let selectedSetups = new Set();
let adminUnlocked = false;
let equityChart = null;
let activeFilter = 'all';
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

// Lokal reset ID okuma (Böylece istatistikler bu ID'den sonrasını baz alır)
let resetId = parseInt(localStorage.getItem('atilla_reset_id')) || 0;

const setupSelector = document.getElementById('setup-selector');
SETUPS.forEach(s => {
    const tag = document.createElement('div');
    tag.className = 'setup-tag';
    tag.textContent = s;
    tag.onclick = () => {
        tag.classList.toggle('active');
        if(tag.classList.contains('active')) selectedSetups.add(s);
        else selectedSetups.delete(s);
    };
    setupSelector.appendChild(tag);
});

document.getElementById('f-date').value = new Date().toISOString().split('T')[0];

function checkPin() {
  const pin = document.getElementById('admin-pin').value;
  adminUnlocked = pin === ADMIN_PIN;
  const st = document.getElementById('pin-status');
  if (adminUnlocked) {
    st.textContent = '✓ admin modu açık';
    st.className = 'pin-status ok';
    document.body.classList.add('admin-unlocked');
    document.getElementById('submit-btn').disabled = false;
  } else {
    st.textContent = 'kilitli';
    st.className = 'pin-status no';
    document.body.classList.remove('admin-unlocked');
    document.getElementById('submit-btn').disabled = true;
  }
  updateResetUI();
}

function updateResetUI() {
    const clearBtn = document.getElementById('clear-reset-btn');
    if (clearBtn) {
        clearBtn.style.display = (adminUnlocked && resetId > 0) ? 'inline-block' : 'none';
    }
}

function setResetPoint() {
    if(!adminUnlocked) return;
    if(!confirm("İstatistiklerin ve Equity Curve 25.000$'a sıfırlanacak. (Geçmiş işlemlerin LİSTEDE kalmaya devam edecek). Emin misin?")) return;
    
    // Mevcut en yüksek ID'yi bul ve kaydet
    const maxId = trades.length > 0 ? Math.max(...trades.map(t => t.id)) : 0;
    localStorage.setItem('atilla_reset_id', maxId);
    resetId = maxId;
    
    showMsg("İstatistikler sıfırlandı!", "ok");
    updateResetUI();
    render();
}

function clearResetPoint() {
    if(!adminUnlocked) return;
    localStorage.removeItem('atilla_reset_id');
    resetId = 0;
    showMsg("Sıfırlama geri alındı!", "ok");
    updateResetUI();
    render();
}

function selectMode(m) {
    selectedMode = m;
    document.getElementById('mode-live').classList.toggle('active', m === 'live');
    document.getElementById('mode-paper').classList.toggle('active', m === 'paper');
    updatePnlPreview();
}

function selectResult(v) {
  selectedResult = v;
  document.querySelectorAll('.result-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + v).classList.add('active');
  if(v === 'be') document.getElementById('f-pnl').value = 0;
  updatePnlPreview();
}

function updatePnlPreview() {
  const val = parseFloat(document.getElementById('f-pnl').value);
  const prev = document.getElementById('pnl-preview');
  
  if (!selectedResult || isNaN(val)) { prev.textContent = ''; return; }
  
  if (selectedMode === 'paper') {
      prev.textContent = '→ Paper Trade (Data olarak saklanır, PnL etkilemez)';
      prev.className = 'pnl-preview pap';
  } else if (selectedResult === 'be') { 
      prev.textContent = '→ $0 (B.E)'; 
      prev.className = 'pnl-preview neu'; 
  } else if (selectedResult === 'win') { 
      prev.textContent = '→ +$' + val.toFixed(0); 
      prev.className = 'pnl-preview pos'; 
  } else { 
      prev.textContent = '→ -$' + val.toFixed(0); 
      prev.className = 'pnl-preview neg'; 
  }
}

async function loadTrades() {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/trades?select=*&order=date.asc,created_at.asc', { headers: H });
    if (!res.ok) throw new Error();
    trades = await res.json();
    document.getElementById('conn-status').textContent = 'canlı';
  } catch(e) {
    document.getElementById('conn-status').textContent = 'bağlantı hatası';
  }
  updateResetUI();
  render();
}

async function addTrade() {
  if (!adminUnlocked) return;
  const date = document.getElementById('f-date').value;
  const rr = parseFloat(document.getElementById('f-rr').value);
  const rawPnl = parseFloat(document.getElementById('f-pnl').value);
  const link = document.getElementById('f-link').value.trim();
  const notes = document.getElementById('f-notes').value.trim();
  const symbol = document.getElementById('f-symbol').value;
  const setupString = Array.from(selectedSetups).join(', ');

  if (!date || !selectedResult || isNaN(rr) || isNaN(rawPnl)) {
    showMsg('Zorunlu alanları doldur!', 'err'); return;
  }

  let pnl = selectedResult === 'win' ? Math.abs(rawPnl) : (selectedResult === 'lose' ? -Math.abs(rawPnl) : 0);
  const dbResult = selectedMode === 'paper' ? 'paper-' + selectedResult : selectedResult;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'KAYDEDİLİYOR...';

  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/trades', {
      method: 'POST',
      headers: { ...H, 'Prefer': 'return=representation' },
      body: JSON.stringify({ date, result: dbResult, rr, pnl, link, notes, symbol, setup: setupString })
    });
    if (!res.ok) throw new Error();
    showMsg('İşlem kaydedildi!', 'ok');
    resetForm();
    await loadTrades();
  } catch(e) { showMsg('Kaydetme hatası!', 'err'); }
  
  btn.disabled = false; btn.textContent = 'İŞLEMİ KAYDET';
}

function resetForm() {
    document.getElementById('f-rr').value = '';
    document.getElementById('f-pnl').value = '';
    document.getElementById('f-link').value = '';
    document.getElementById('f-notes').value = '';
    selectedSetups.clear();
    document.querySelectorAll('.setup-tag').forEach(t => t.classList.remove('active'));
    selectedResult = null;
    document.querySelectorAll('.result-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('pnl-preview').textContent = '';
}

function render() {
    // Listeyi her halükarda TÜM verilerle doldur (Filtrelere göre)
    renderList();

    // İstatistikler için SADECE (Live + Reset ID sonrasındaki) işlemleri baz alıyoruz
    const liveTradesAll = trades.filter(t => !t.result.startsWith('paper-'));
    const liveTradesStats = liveTradesAll.filter(t => t.id > resetId);
    
    document.getElementById('reset-badge').style.display = resetId > 0 ? 'inline-block' : 'none';

    const totalPnl = liveTradesStats.reduce((s, t) => s + Number(t.pnl), 0);
    const currentEquity = INITIAL_BALANCE + totalPnl;

    renderGauge(currentEquity);
    renderStats(liveTradesStats, totalPnl);
    renderEquityChart(liveTradesStats);
    renderSymbolStats(liveTradesStats);
    renderCal(liveTradesStats);
}

function renderList() {
  const el = document.getElementById('trade-list');
  
  const list = [...trades].reverse().filter(t => {
      const isPaper = t.result.startsWith('paper-');
      if (activeFilter === 'all') return true;
      if (activeFilter === 'live') return !isPaper;
      if (activeFilter === 'paper') return isPaper;
      if (['win', 'lose', 'be'].includes(activeFilter)) {
          return t.result === activeFilter || t.result === ('paper-' + activeFilter);
      }
      return (t.symbol || 'MNQ1!') === activeFilter;
  });

  document.getElementById('trade-count').textContent = list.length + ' işlem';
  
  if(!list.length) { el.innerHTML = '<div class="empty">İşlem bulunamadı.</div>'; return; }

  el.innerHTML = list.map(t => {
      const isPaper = t.result.startsWith('paper-');
      const pureResult = isPaper ? t.result.replace('paper-', '') : t.result;
      const setupBadges = t.setup ? t.setup.split(', ').map(s => `<span class="setup-mini-badge">${s}</span>`).join('') : '';
      
      let pnlCls = '';
      let pnlText = '';
      let cardCls = isPaper ? 'paper' : pureResult;
      
      if (isPaper) {
          pnlCls = 'pap'; pnlText = `P $${Math.abs(Number(t.pnl)).toFixed(0)}`;
      } else if (pureResult === 'be') {
          pnlCls = 'neu'; pnlText = `$0`;
      } else if (Number(t.pnl) > 0) {
          pnlCls = 'pos'; pnlText = `+$${Math.abs(Number(t.pnl)).toFixed(0)}`;
      } else {
          pnlCls = 'neg'; pnlText = `-$${Math.abs(Number(t.pnl)).toFixed(0)}`;
      }

      return `
        <div class="trade-card ${cardCls}">
          <div class="trade-top" onclick="toggleNotes(${t.id})">
            
            <span class="badge ${pureResult}">${pureResult === 'be' ? 'B.E' : pureResult.toUpperCase()}</span>
            ${isPaper ? '<span class="badge paper-tag">PAPER</span>' : ''}
            
            <span class="sym-badge">${t.symbol || 'MNQ1!'}</span>
            
            <div class="trade-meta">
              <div class="meta-item"><span style="font-size:10px">PNL</span><span class="meta-val ${pnlCls}">${pnlText}</span></div>
            </div>

            <div class="trade-actions">
              ${t.link ? `<a class="chart-link" href="${t.link}" target="_blank" onclick="event.stopPropagation()">CHART ↗</a>` : ''}
              <span class="expand-icon" id="icon-${t.id}">▼</span>
              <button class="del-btn" onclick="event.stopPropagation();deleteTrade(${t.id})">✕</button>
            </div>
          </div>
          
          <div class="trade-notes" id="notes-${t.id}">
            <div style="font-size:10px; color:var(--muted); margin-bottom:4px">TARİH & RR</div>
            <div style="font-family:JetBrains Mono; font-size:12px; margin-bottom:12px; color:var(--text)">${t.date} | ${t.rr}R</div>
            ${setupBadges ? `<div style="font-size:10px; color:var(--muted); margin-bottom:4px; font-weight:800">KONFİRMELER</div><div class="setup-display">${setupBadges}</div>` : ''}
            <div style="font-size:10px; color:var(--muted); margin-bottom:4px; font-weight:800">NOTLAR</div>
            ${t.notes || 'Not yok.'}
          </div>
        </div>
      `;
  }).join('');
}

function renderGauge(equity) {
    const container = document.getElementById('gauge-container');
    const targetVal = INITIAL_BALANCE + PROFIT_TARGET;
    const drawdownVal = INITIAL_BALANCE - DRAWDOWN_LIMIT;
    
    const totalRange = targetVal - drawdownVal;
    const currentFromMin = equity - drawdownVal;
    let pct = (currentFromMin / totalRange) * 100;
    pct = Math.max(0, Math.min(100, pct));

    container.innerHTML = `
        <div class="gauge-header">
            <div class="gauge-title">Hesap Durumu (Target & Drawdown)</div>
            <div class="gauge-equity" style="color: ${equity >= INITIAL_BALANCE ? 'var(--green)' : 'var(--red)'}">$${equity.toFixed(0)}</div>
        </div>
        <div class="gauge-bar-outer">
            <div class="gauge-marker" style="left: ${((INITIAL_BALANCE - drawdownVal) / totalRange) * 100}%"></div>
            <div class="gauge-bar-inner" style="width: ${pct}%"></div>
        </div>
        <div class="gauge-labels">
            <span>DRAWDOWN ($${drawdownVal})</span>
            <span>BAŞLANGIÇ ($${INITIAL_BALANCE})</span>
            <span>TARGET ($${targetVal})</span>
        </div>
    `;
}

function renderStats(realTrades, totalPnl) {
    const el = document.getElementById('stats-grid');
    if(!realTrades.length) { el.innerHTML = ''; return; }
    
    const total = realTrades.length;
    const wins = realTrades.filter(t => t.result === 'win').length;
    const loses = realTrades.filter(t => t.result === 'lose').length;
    const bes = realTrades.filter(t => t.result === 'be').length;

    const wrBase = wins + loses;
    const wr = wrBase > 0 ? ((wins / wrBase) * 100).toFixed(1) : "0.0";
    
    const grossWin = realTrades.filter(t => Number(t.pnl) > 0).reduce((s, t) => s + Number(t.pnl), 0);
    const grossLoss = Math.abs(realTrades.filter(t => Number(t.pnl) < 0).reduce((s, t) => s + Number(t.pnl), 0));
    const pf = grossLoss === 0 ? (grossWin > 0 ? '∞' : '0.00') : (grossWin / grossLoss).toFixed(2);
    
    const avgRR = (realTrades.reduce((s, t) => s + Number(t.rr), 0) / total).toFixed(2);

    el.innerHTML = `
        <div class="stat-card">
            <div class="stat-label">Toplam PnL</div>
            <div class="stat-val ${totalPnl>=0?'pos':'neg'}">${totalPnl>=0?'+':''}$${totalPnl.toFixed(0)}</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Win Rate</div>
            <div class="stat-val">${wr}%</div>
            <div class="stat-detail">W:${wins} | L:${loses} | B:${bes}</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Profit Factor</div>
            <div class="stat-val">${pf}</div>
            <div class="stat-detail">Brüt W: $${grossWin.toFixed(0)}<br>Brüt L: $${grossLoss.toFixed(0)}</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Ort. RR</div>
            <div class="stat-val">${avgRR}R</div>
            <div class="stat-detail">Toplam İşlem: ${total}</div>
        </div>
    `;
}

function renderEquityChart(realTrades) {
  const el = document.getElementById('equity-chart');
  if (!realTrades.length) { el.getContext('2d').clearRect(0,0,el.width,el.height); return; }
  
  const sorted = [...realTrades].sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
  let cum = INITIAL_BALANCE;
  const labels = ['Başlangıç'];
  const data = [INITIAL_BALANCE];
  
  sorted.forEach(t => { 
    cum += Number(t.pnl); 
    labels.push(t.date); 
    data.push(parseFloat(cum.toFixed(2))); 
  });

  if (equityChart) equityChart.destroy();
  const ctx = el.getContext('2d');
  const lastVal = data[data.length - 1] || INITIAL_BALANCE;
  const color = lastVal >= INITIAL_BALANCE ? '#00ff88' : '#ff4455';
  
  equityChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ data, borderColor: color, borderWidth: 2, pointRadius: data.length > 30 ? 0 : 3, pointBackgroundColor: color, fill: true, backgroundColor: lastVal >= INITIAL_BALANCE ? 'rgba(0,255,136,0.07)' : 'rgba(255,68,85,0.07)', tension: 0.3 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { display: false },
        y: { grid: { color: '#1a1a1a' }, ticks: { color: '#666', font: { family: 'JetBrains Mono', size: 11 }, callback: v => '$' + v } }
      }
    }
  });
}

function renderSymbolStats(realTrades) {
    const el = document.getElementById('symbol-grid');
    const symbols = ['MNQ1!', 'MES1!', 'MYM1!'];

    el.innerHTML = symbols.map(sym => {
        const st = realTrades.filter(t => (t.symbol || 'MNQ1!') === sym);
        if (!st.length) return `<div class="symbol-card"><div class="symbol-name">${sym}</div><div class="symbol-row"><span>İşlem yok</span></div></div>`;
        
        const wins = st.filter(t => t.result === 'win').length;
        const loses = st.filter(t => t.result === 'lose').length;
        const bes = st.filter(t => t.result === 'be').length;
        const wrBase = wins + loses;
        const wr = wrBase > 0 ? ((wins / wrBase) * 100).toFixed(1) : "0.0";
        const pnl = st.reduce((s, t) => s + Number(t.pnl), 0);
        
        return `
            <div class="symbol-card">
                <div class="symbol-name">${sym}</div>
                <div class="symbol-row"><span>İşlem</span><span>${st.length}</span></div>
                <div class="symbol-row"><span>Win Rate</span><span>${wr}%</span></div>
                <div class="symbol-row"><span>PnL</span><span class="${pnl>=0?'pos':'neg'}">${pnl>=0?'+':''}$${pnl.toFixed(0)}</span></div>
                <div class="symbol-row"><span>W / L / B</span><span>${wins}/${loses}/${bes}</span></div>
            </div>
        `;
    }).join('');
}

function changeMonth(d) {
  calMonth += d;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  // Sadece Reset ID sonrasındaki Live işlemleri takvime ver
  const liveTradesAll = trades.filter(t => !t.result.startsWith('paper-'));
  const liveTradesStats = liveTradesAll.filter(t => t.id > resetId);
  renderCal(liveTradesStats);
}

function renderCal(realTrades) {
  const months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  document.getElementById('cal-title').textContent = months[calMonth] + ' ' + calYear;
  const grid = document.getElementById('cal-grid');
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const firstDay = (new Date(calYear, calMonth, 1).getDay() + 6) % 7;
  const today = new Date().toISOString().split('T')[0];
  const dayData = {};
  
  realTrades.forEach(t => {
    const [y, m, dd] = t.date.split('-').map(Number);
    if (y === calYear && m === calMonth + 1) {
      if (!dayData[dd]) dayData[dd] = { pnl: 0, count: 0 };
      dayData[dd].pnl += Number(t.pnl);
      dayData[dd].count++;
    }
  });
  
  const dows = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  let html = dows.map(d => '<div class="cal-dow">' + d + '</div>').join('');
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';
  
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const data = dayData[d];
    let cls = 'cal-day';
    if (ds === today) cls += ' today';
    else if (data) {
        if(data.pnl > 0) cls += ' profit';
        else if(data.pnl < 0) cls += ' loss';
    }
    html += `
        <div class="${cls}">
            <div class="day-num">${d}</div>
            ${data ? `
                <div class="day-pnl ${data.pnl>0?'pos':(data.pnl<0?'neg':'')}">${data.pnl>0?'+':''}$${Math.abs(data.pnl).toFixed(0)}</div>
                <div class="day-count">${data.count} işlem</div>
            ` : ''}
        </div>
    `;
  }
  grid.innerHTML = html;
}

function toggleNotes(id) {
  document.getElementById('notes-' + id)?.classList.toggle('open');
  document.getElementById('icon-' + id)?.classList.toggle('open');
}

function showTab(t) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  document.querySelectorAll('.tab')[['log','list','stats'].indexOf(t)].classList.add('active');
  if (t === 'stats') {
      const liveTradesAll = trades.filter(tr => !tr.result.startsWith('paper-'));
      const liveTradesStats = liveTradesAll.filter(tr => tr.id > resetId);
      setTimeout(() => renderEquityChart(liveTradesStats), 100);
  }
}

function setFilter(btn, f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function showMsg(txt, type) {
  const el = document.getElementById('form-msg');
  el.textContent = txt; el.className = 'msg ' + type;
  setTimeout(() => { el.textContent = ''; el.className = 'msg'; }, 3000);
}

loadTrades();
</script>
